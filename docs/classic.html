<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mekong Rotation Explorer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1 data-i18n="title"></h1>
        <p class="adv-only" data-i18n="tagline"></p>
      </div>
      <button id="lang" type="button" data-i18n="langBtn"></button>
    </div>
    <div class="ui-row">
      <span id="uiH" data-i18n="uiLabel"></span>
      <div class="mode" role="group" aria-labelledby="uiH">
        <button type="button" id="uiSimple" data-i18n="uiSimple" aria-pressed="false"></button>
        <button type="button" id="uiAdvanced" data-i18n="uiAdvanced" aria-pressed="true"></button>
      </div>
      <p class="hint simple-only" data-i18n="uiHint"></p>
    </div>
    <p class="disclaimer" data-i18n="disclaimer"></p>
  </header>

  <main>
    <section class="panel wide fields" aria-labelledby="fieldsH">
      <h2 id="fieldsH" data-i18n="fieldsTitle"></h2>
      <div id="fieldTabs" class="field-tabs" role="group" aria-labelledby="fieldsH"></div>
      <p id="fieldNote" class="hint" data-i18n="fieldNote"></p>
      <details id="fieldMore"><summary data-i18n="fieldEdit"></summary>
        <div class="field-edit">
          <label class="field"><span data-i18n="fieldName"></span><input id="fieldName" type="text" maxlength="40"></label>
          <button type="button" id="fieldDel" aria-live="polite"></button>
        </div>
      </details>
    </section>
    <section class="panel" id="pArea">
      <h2 data-i18n="step1"></h2>
      <p class="hint adv-only" data-i18n="step1hint"></p>
      <div id="map" role="application"></div>
      <p id="siteName" class="site-name"></p>
      <ul id="siteSummary" class="summary" aria-live="polite"></ul>
      <details class="area-more"><summary data-i18n="areaMore"></summary>
        <p id="saltNote" class="hint"></p>
        <p id="soilLine" class="hint"></p>
      </details>
      <label class="field"><span data-i18n="current"></span>
        <select id="current">
          <option value="rice3" data-i18n="rice3"></option>
          <option value="rice2" data-i18n="rice2"></option>
          <option value="rice_shrimp" data-i18n="riceShrimp"></option>
        </select>
      </label>
      <p id="satSees" class="hint"></p>
    </section>

    <section class="panel" id="pYear">
      <h2 id="step2h" data-i18n="step2"></h2>
      <p id="outlook" class="outlook"></p>
      <div class="mode" role="group" aria-labelledby="step2h">
        <button type="button" id="modeTypical" data-i18n="modeTypical" aria-pressed="true"></button>
        <button type="button" id="modeElnino" data-i18n="modeElnino" aria-pressed="false"></button>
      </div>
      <p id="modeNote" class="hint"></p>
      <details id="modeYearsBox" class="hint"><summary data-i18n="modeYearsBtn"></summary><p data-i18n="modeYears"></p></details>
      <div class="chart-box adv-only"><canvas id="chart" role="img" aria-label="Monthly rain, water demand and greenness chart"></canvas></div>
      <details id="legendBox" class="legend-box adv-only" hidden><summary data-i18n="legendBtn"></summary><ul id="legendList"></ul></details>
      <p id="chartSrc" class="hint adv-only"></p>
      <p id="ndviNote" class="hint adv-only"></p>
    </section>

    <section class="panel" id="pWants">
      <h2 data-i18n="step3"></h2>
      <div id="weights"></div>
      <fieldset>
        <legend data-i18n="limits"></legend>
        <label><input type="checkbox" id="noBrackish"> <span data-i18n="c_brackish"></span></label>
        <label><input type="checkbox" id="lowLabour"> <span data-i18n="c_labour"></span></label>
      </fieldset>
    </section>

    <section class="panel wide" id="pCards">
      <h2 data-i18n="step4"></h2>
      <p id="commonNote" class="hint"></p>
      <p id="yourField" class="site-name simple-only"></p>
      <div id="cards" class="cards"></div>
      <details id="moreCards" hidden><summary></summary><div id="moreList" class="cards"></div></details>
      <p id="hiddenNote" class="hint"></p>
      <details class="soil-help adv-only"><summary data-i18n="soilHelpTitle"></summary>
        <ul id="soilHelpList"></ul>
        <p class="hint" data-i18n="soilHelpNone"></p>
      </details>
    </section>

    <section class="panel wide" id="plan" tabindex="-1">
      <h2 data-i18n="step5"></h2>
      <p id="planFor" class="site-name"></p>
      <div id="planStrip"></div>
      <p id="stripKey" class="hint strip-key"></p>
      <p id="planWarn" class="warn" hidden></p>
      <ol id="planList" class="plan"></ol>
      <details id="planMore" hidden><summary data-i18n="planMore"></summary><ol id="planMoreList" class="plan"></ol></details>
      <details id="seedBox"><summary data-i18n="seedTitle"></summary>
        <label class="field"><span data-i18n="seedPick"></span><select id="seedCrop"></select></label>
        <p id="seedResult"></p>
        <p class="hint" data-i18n="seedRule"></p>
      </details>
      <details id="needsBox" open><summary><h3 data-i18n="planNeed"></h3></summary>
        <div id="planNeeds" class="plan"></div>
      </details>
      <p class="talk" data-i18n="talk"></p>
    </section>

    <section class="panel wide adv-only">
      <details class="about"><summary><h2 data-i18n="aboutTitle"></h2></summary>
        <ul id="about"></ul>
      </details>
    </section>

    <section class="panel wide">
      <details id="sourcesBox" class="about"><summary><h2 id="sourcesH"></h2></summary>
        <ol id="sourceList" class="source-list"></ol>
      </details>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
